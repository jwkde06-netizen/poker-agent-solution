name: Supabase Auth 진단

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-auth-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Auth users 트리거 확인
        shell: bash
        run: |
          SQL="select
            n.nspname as schema_name,
            c.relname as table_name,
            t.tgname as trigger_name,
            pg_get_triggerdef(t.oid) as trigger_def
          from pg_trigger t
          join pg_class c on c.oid=t.tgrelid
          join pg_namespace n on n.oid=c.relnamespace
          where not t.tgisinternal
            and n.nspname='auth'
            and c.relname='users';"
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body -sS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -X POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary "$PAYLOAD"

      - name: Auth 관련 사용자 함수 확인
        shell: bash
        run: |
          SQL="select n.nspname as schema_name, p.proname as function_name,
          pg_get_functiondef(p.oid) as definition
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname in ('public','auth')
            and (
              p.proname ilike '%user%'
              or p.proname ilike '%profile%'
              or p.proname ilike '%signup%'
            )
          order by 1,2;"
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body -sS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -X POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary "$PAYLOAD"


      - name: 기존 관리자 계정 상태 확인
        shell: bash
        run: |
          SQL="select id, email, created_at, email_confirmed_at,
          length(coalesce(encrypted_password,'')) as password_length,
          is_anonymous
          from auth.users
          where lower(email)=lower('jwkde06@gmail.com');"
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body -sS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -X POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary "$PAYLOAD"

      - name: 현재 admin username 매핑 확인
        shell: bash
        run: |
          SQL="select
            p.user_id,
            p.username,
            p.email as profile_email,
            p.role,
            p.active,
            u.email as auth_email,
            u.email_confirmed_at is not null as email_confirmed,
            length(coalesce(u.encrypted_password,'')) as password_length
          from public.user_profiles p
          left join auth.users u on u.id=p.user_id
          where lower(coalesce(p.username,''))='admin'
             or p.role='admin'
          order by p.created_at asc;"
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body -sS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -X POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary "$PAYLOAD"

      - name: username resolver 확인
        shell: bash
        run: |
          SQL="select public.resolve_login_email('admin') as resolved_email;"
          PAYLOAD=$(jq -n --arg query "$SQL" '{query:$query}')
          curl --fail-with-body -sS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"             -X POST             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary "$PAYLOAD"

      - name: 최근 Auth / Postgres 오류 로그 확인
        shell: bash
        run: |
          START=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="select timestamp, source, event_message
          from logs
          where source in ('auth_logs','postgres_logs')
            and (
              positionCaseInsensitive(event_message, 'error') > 0
              or positionCaseInsensitive(event_message, 'fail') > 0
              or positionCaseInsensitive(event_message, 'unexpected') > 0
            )
          order by timestamp desc
          limit 100"
          curl --fail-with-body -sS --get             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             --data-urlencode "sql=$SQL"             --data-urlencode "iso_timestamp_start=$START"             --data-urlencode "iso_timestamp_end=$END"
