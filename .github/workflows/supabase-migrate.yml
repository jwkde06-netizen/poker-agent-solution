name: Supabase DB 자동 반영

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase 마이그레이션 적용
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 비밀값 설정 확인
        id: secrets_check
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase GitHub Secrets가 아직 설정되지 않아 DB 반영을 건너뜁니다."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node.js 준비
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Supabase 프로젝트 연결
        if: steps.secrets_check.outputs.configured == 'true'
        shell: bash
        run: |
          npx --yes supabase@latest link             --project-ref "$SUPABASE_PROJECT_REF"             --password "$SUPABASE_DB_PASSWORD"

      - name: DB 마이그레이션 적용
        if: steps.secrets_check.outputs.configured == 'true'
        shell: bash
        run: |
          npx --yes supabase@latest db push             --password "$SUPABASE_DB_PASSWORD"

      - name: 완료 안내
        if: steps.secrets_check.outputs.configured == 'true'
        run: echo "Supabase DB 마이그레이션 적용 완료"
