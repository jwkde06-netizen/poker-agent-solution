name: Supabase DB 자동 반영

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase 마이그레이션 적용
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 비밀값 설정 확인
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "필수 GitHub Secrets가 없습니다."
            exit 1
          fi

      - name: 마이그레이션 기록 테이블 준비
        shell: bash
        run: |
          SQL="create table if not exists public._app_migrations (
            filename text primary key,
            applied_at timestamptz not null default now()
          );"
          jq -n --arg query "$SQL" '{query:$query}' > /tmp/setup-payload.json
          curl --fail-with-body -sS \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/setup-payload.json"

      - name: 새 DB 마이그레이션 적용
        shell: bash
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)

          if [ ${#files[@]} -eq 0 ]; then
            echo "적용할 migration 파일이 없습니다."
            exit 0
          fi

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            echo "확인 중: $filename"

            CHECK_SQL="select exists(
              select 1 from public._app_migrations where filename = '$filename'
            ) as applied;"
            jq -n --arg query "$CHECK_SQL" '{query:$query}' > /tmp/check-payload.json
            CHECK_RESULT=$(curl --fail-with-body -sS \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@/tmp/check-payload.json")

            if echo "$CHECK_RESULT" | jq -e '.[0].applied == true' >/dev/null 2>&1; then
              echo "건너뜀: $filename (이미 적용됨)"
              continue
            fi

            TMP_SQL=$(mktemp)
            TMP_PAYLOAD=$(mktemp)
            {
              echo "begin;"
              cat "$file"
              echo
              echo "insert into public._app_migrations(filename) values ('$filename');"
              echo "commit;"
            } > "$TMP_SQL"

            jq -Rs '{query:.}' "$TMP_SQL" > "$TMP_PAYLOAD"

            echo "적용 중: $filename"
            curl --fail-with-body -sS \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$TMP_PAYLOAD"

            rm -f "$TMP_SQL" "$TMP_PAYLOAD"
            echo "완료: $filename"
          done

      - name: 완료 안내
        run: echo "Supabase DB 자동 반영 완료"
